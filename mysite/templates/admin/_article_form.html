<form method="post" enctype="multipart/form-data" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>News title<input type="text" name="title" required maxlength="300" value="{{ n.title or '' }}"></label>
  <label>Source / byline<input type="text" name="source" maxlength="100" value="{{ n.source if n.source is not none else 'A.A.News Exclusive' }}"></label>
  <label>Author (optional)<input type="text" name="author" maxlength="100" value="{{ n.author or '' }}"></label>
  <label>Short summary (optional, used for search and social previews)<input type="text" name="description" maxlength="400" value="{{ n.description or '' }}"></label>
  <label>Image URL<input type="text" name="image_url" placeholder="https://… (or upload below)" value="{{ n.image_url or '' }}"></label>
  <label>…or upload an image (JPEG/PNG/WebP, max 3 MB)<input type="file" name="image_file" accept="image/jpeg,image/png,image/webp"></label>
  <label>Detailed content<textarea name="content" rows="10" required>{{ n.content or '' }}</textarea></label>
  <label>Category<select name="category">{% for c in categories %}<option value="{{ c.slug }}" {{ 'selected' if n.category == c.slug }}>{{ c.label }}</option>{% endfor %}</select></label>
  <div class="row">
    <label>Status<select name="status"><option value="published" {{ 'selected' if n.status != 'draft' }}>Published</option><option value="draft" {{ 'selected' if n.status == 'draft' }}>Draft</option></select></label>
    <label>Schedule publish (optional, India time)<input type="datetime-local" name="publish_at" value="{{ n.publish_at_local or '' }}"></label>
  </div>
  <label class="check"><input type="checkbox" name="is_featured" {{ 'checked' if n.is_featured }}> Featured on homepage</label>
  <label class="check"><input type="checkbox" name="is_breaking" {{ 'checked' if n.is_breaking }}> Breaking news banner</label>
  <button class="btn" type="submit">{{ button }}</button>
</form>
