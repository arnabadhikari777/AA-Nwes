<script nonce="{{ csp_nonce() }}">
/* Replaces the old inline handlers (onerror / onsubmit / onclick) that the CSP forbids. */
(function () {
  /* <img data-fb="fallback-url">: try the fallback once, then hide the image */
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'IMG' || !t.dataset || !t.dataset.fb) return;
    if (t.dataset.f) {
      t.style.display = 'none';
      if (t.parentNode && t.parentNode.classList) t.parentNode.classList.add('noimg');
      return;
    }
    t.dataset.f = '1';
    t.src = t.dataset.fb;
  }, true);
  /* <form data-confirm="Are you sure?"> */
  document.addEventListener('submit', function (e) {
    var m = e.target && e.target.getAttribute && e.target.getAttribute('data-confirm');
    if (m && !window.confirm(m)) e.preventDefault();
  }, true);
  /* <button data-reload> */
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('[data-reload]')) location.reload();
  });
})();
</script>
