<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ news[0] }} - A.A.News</title>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M4Q795Q81V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-M4Q795Q81V');
</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Playfair+Display:wght@800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0e1a30;
            --navy-soft: #16223c;
            --crimson: #e6314b;
            --crimson-deep: #b81d36;
            --gold: #f2a71b;
            --cream: #f6f2e9;
        }
        body { font-family: 'Noto Serif Bengali', 'Inter', serif; background-color: var(--cream); margin: 0; padding: 0; color: #2c3345; }
        .navbar { background: linear-gradient(120deg, var(--navy) 0%, var(--navy-soft) 100%); padding: 18px 22px; text-align: center; box-shadow: 0 4px 16px rgba(14,26,48,0.18); }
        .navbar a { color: white; text-decoration: none; font-size: 24px; font-weight: 800; font-family: 'Playfair Display', serif; letter-spacing: 0.3px; }
        .navbar a span { color: var(--gold); }

        .article-container { max-width: 800px; margin: 40px auto; background: #fffdf9; padding: 34px; border-radius: 14px; box-shadow: 0 12px 34px rgba(14,26,48,0.10); border: 1px solid #e6ddc9; }
        .source-badge { display: inline-block; background: linear-gradient(120deg, var(--crimson), var(--crimson-deep)); color: white; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: 18px; font-family: 'Inter', sans-serif; letter-spacing: 0.3px; text-transform: uppercase; }
        .article-title { font-family: 'Playfair Display', 'Noto Serif Bengali', serif; font-size: 32px; font-weight: 800; line-height: 1.4; margin-bottom: 22px; color: var(--navy); }
        .article-image { width: 100%; border-radius: 10px; margin-bottom: 26px; }
        .article-content { font-size: 18px; line-height: 1.85; color: #444; white-space: pre-wrap; /* this keeps paragraph spacing correct */ }

        .back-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 32px; padding: 11px 22px; background: linear-gradient(120deg, var(--gold), #ff8a3d); color: var(--navy); text-decoration: none; border-radius: 999px; font-weight: 800; font-family: 'Inter', sans-serif; font-size: 14px; transition: transform 0.2s ease, filter 0.2s ease; }
        .back-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }

        @media (max-width: 768px) {
            .article-container { margin: 15px; padding: 22px; }
            .article-title { font-size: 24px; }
            .article-content { font-size: 16px; }
        }
    </style>
    <script src="/static/presence.js" defer></script>
</head>
<body>

    <div class="navbar">
        <a href="/">A.A.<span>News</span></a>
    </div>

    <div class="article-container">
        <!-- Source name -->
        <span class="source-badge">{{ news[1] }}</span>
        
        <!-- News title -->
        <h1 class="article-title">{{ news[0] }}</h1>
        
        <!-- News image -->
        <img src="{{ news[2] }}" alt="News Image" class="article-image" onerror="this.src='https://dummyimage.com/800x400/ccc/000.png&text=No+Image'">
        
        <!-- Full news content -->
        <div class="article-content">{{ news[3] }}</div>

        <!-- Back button -->
        <a href="/" class="back-btn">« Back to Home</a>
    </div>

</body>
</html>
