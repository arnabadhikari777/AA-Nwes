<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - A.A.News</title>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M4Q795Q81V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function () {
        window.dataLayer.push(arguments);
    };
  gtag('js', new Date());

  gtag('config', 'G-M4Q795Q81V');
</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0e1a30;
            --navy-soft: #16223c;
            --crimson: #e6314b;
            --gold: #f2a71b;
            --cream: #f6f2e9;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 55%, #1c2a4a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-box {
            background: #fffdf9;
            padding: 40px 34px;
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.35);
            text-align: center;
            width: 100%;
            max-width: 340px;
            border-top: 5px solid var(--gold);
        }
        .brand {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 24px;
            color: var(--navy);
            margin-bottom: 4px;
        }
        .brand span { color: var(--crimson); }
        h2 {
            color: var(--navy);
            margin: 14px 0 22px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            margin: 10px 0;
            border: 1px solid #ddd6c6;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(242,167,27,0.25);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(120deg, var(--crimson), #b81d36);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.4px;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        button:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .error {
            color: #b81d36;
            background: #fdeaec;
            border: 1px solid #f6c6cd;
            padding: 10px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .back-home {
            display: inline-block;
            font-size: 13px;
            color: var(--navy-soft);
            text-decoration: none;
            margin-top: 18px;
            font-weight: 600;
        }
        .back-home:hover { color: var(--crimson); }
    </style>
</head>
<body>

<div class="login-box">
    <div class="brand">A.A.<span>News</span></div>
    <h2>🔒 Admin Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/login" method="POST">
        <input type="password" name="password" placeholder="Enter password..." required>
        <button type="submit">Login</button>
    </form>
    <br>
    <a href="/" class="back-home">🏠 Return to Website</a>
</div>

</body>
</html>
